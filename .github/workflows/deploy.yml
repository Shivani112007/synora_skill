
name: Synora CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: synora-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Synora with SSM and Puppet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: i-092d913d113de6871
      APP_DIR: /var/www/synora
      PUPPET_MANIFEST: /etc/puppetlabs/code/environments/production/manifests/synora.pp

    steps:
      # 1. Get the latest repository source
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Inspect OIDC claims for troubleshooting
      - name: Check GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`Repository: ${payload.repository}`);
            core.info(`Subject: ${payload.sub}`);
            core.info(`Audience: ${payload.aud}`);

      # 3. Authenticate with AWS through OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 4. Verify AWS authentication
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 5. Validate the Puppet manifest
      - name: Check Puppet manifest exists
        run: |
          test -f puppet/manifests/synora.pp || {
            echo "ERROR: puppet/manifests/synora.pp is missing."
            exit 1
          }

      # 6. Deploy using SSM on the EC2 instance
      - name: Send deployment command to EC2
        id: ssm
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMANDS=$(python3 - <<'PY'
          import json
          import os

          app_dir = os.environ["APP_DIR"]
          manifest = os.environ["PUPPET_MANIFEST"]
          commit = os.environ["COMMIT_SHA"]

          commands = [
              "set -eu",
              f"cd {app_dir}",
              "git fetch origin main",
              # Do not overwrite local modifications on EC2.
              "if ! git diff --quiet || ! git diff --cached --quiet; then echo 'ERROR: Local tracked changes exist in /var/www/synora. Resolve them before deployment.'; exit 1; fi",
              "if [ -n \"$(git ls-files --others --exclude-standard)\" ]; then echo 'ERROR: Untracked files exist in the application directory. Review them before deployment.'; exit 1; fi",
              f"git merge-base --is-ancestor {commit} origin/main",
              "git merge --ff-only origin/main",
              f"install -D -m 0644 puppet/manifests/synora.pp {manifest}",
              f"/opt/puppetlabs/bin/puppet parser validate {manifest}",
              f"/opt/puppetlabs/bin/puppet apply {manifest}",
              "sudo systemctl restart synora",
              "sudo systemctl is-active --quiet synora",
              "sudo systemctl is-active --quiet nginx",
              "curl --fail --silent --show-error http://127.0.0.1:8000/ > /dev/null",
              "echo 'Synora deployment completed successfully.'"
          ]

          print(json.dumps(commands))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Synora commit ${COMMIT_SHA}" \
            --parameters "commands=${COMMANDS}" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      # 7. Wait for SSM and fail if the remote deployment fails
      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "ERROR: Timed out waiting for SSM."
          exit 1
