
name: Synora CI/CD Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Verify AWS OIDC Connection
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the GitHub repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Inspect OIDC claims without printing the token
      - name: Check GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`Repository: ${payload.repository}`);
            core.info(`Subject: ${payload.sub}`);
            core.info(`Audience: ${payload.aud}`);

      # Step 3: Authenticate with AWS using OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # Step 4: Verify the AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity
