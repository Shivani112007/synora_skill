
name: Synora CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: synora-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Synora with SSM and Puppet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: i-092d913d113de6871
      APP_DIR: /var/www/synora
      PUPPET_MANIFEST: /etc/puppetlabs/code/environments/production/manifests/synora.pp

    steps:
      # 1. Checkout repository source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Display OIDC claims for troubleshooting
      - name: Check GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`Repository: ${payload.repository}`);
            core.info(`Subject: ${payload.sub}`);
            core.info(`Audience: ${payload.aud}`);

      # 3. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 4. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 5. Validate the Puppet manifest exists
      - name: Validate Puppet manifest exists
        run: |
          set -euo pipefail

          if [ ! -f puppet/manifests/synora.pp ]; then
            echo "ERROR: puppet/manifests/synora.pp is missing."
            exit 1
          fi

      # 6. Send deployment commands to EC2 through SSM
      - name: Send deployment command to EC2
        id: ssm
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMANDS=$(python3 - <<'PY'
          import json
          import os

          app_dir = os.environ["APP_DIR"]
          manifest = os.environ["PUPPET_MANIFEST"]
          commit = os.environ["COMMIT_SHA"]

          commands = [
              "set -eu",
              "cd /var/www/synora",
              "sudo -u ec2-user git -C /var/www/synora fetch origin main",

              # Protect local modifications and untracked files.
              "if ! sudo -u ec2-user git -C /var/www/synora diff --quiet || ! sudo -u ec2-user git -C /var/www/synora diff --cached --quiet; then echo 'ERROR: Local tracked changes exist in /var/www/synora.'; exit 1; fi",
              "if [ -n \"$(sudo -u ec2-user git -C /var/www/synora ls-files --others --exclude-standard)\" ]; then echo 'ERROR: Untracked files exist in /var/www/synora.'; exit 1; fi",

              # Only deploy a commit present in origin/main.
              f"sudo -u ec2-user git -C /var/www/synora merge-base --is-ancestor {commit} origin/main",

              # Fast-forward without discarding local changes.
              "sudo -u ec2-user git -C /var/www/synora merge --ff-only origin/main",

              # Install Python dependencies.
              "sudo -u ec2-user /var/www/synora/venv/bin/pip install -r /var/www/synora/requirements.txt",

              # Install and validate Puppet manifest.
              f"install -D -m 0644 {app_dir}/puppet/manifests/synora.pp {manifest}",
              f"/opt/puppetlabs/bin/puppet parser validate {manifest}",

              # Apply configuration management.
              f"/opt/puppetlabs/bin/puppet apply {manifest}",

              # Restart and verify services.
              "sudo systemctl restart synora",
              "sudo systemctl is-active --quiet synora",
              "sudo systemctl is-active --quiet nginx",

              # Check application health.
              "for attempt in $(seq 1 12); do if curl --fail --silent --show-error http://127.0.0.1:8000/ > /dev/null; then echo 'Synora is responding successfully.'; break; fi; if [ \"$attempt\" -eq 12 ]; then echo 'ERROR: Synora did not become ready in time.'; sudo systemctl status synora --no-pager -l || true; sudo journalctl -u synora -n 40 --no-pager || true; exit 1; fi; sleep 5; done",

              # Verify Nginx endpoint.
              "curl --fail --silent --show-error http://127.0.0.1/ > /dev/null",

              "echo 'Synora deployment completed successfully.'"
          ]

          print(json.dumps(commands))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Synora commit ${COMMIT_SHA}" \
            --parameters "commands=${COMMANDS}" \
            --query 'Command.CommandId' \
            --output text)

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "ERROR: Failed to obtain an SSM command ID."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      # 7. Wait for SSM to finish and report the result
      - name: Wait for deployment result
        id: deployment_result
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "ERROR: Timed out waiting for SSM."
          exit 1

      # 8. Record deployment outcome in the EC2 deployment log
      - name: Log deployment result to CloudWatch
        if: always() && steps.aws_credentials.outcome == 'success'
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RESULT: ${{ steps.deployment_result.outcome }}
        run: |
          set -euo pipefail

          export DEPLOY_TIMESTAMP
          DEPLOY_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 - <<'PY' > deployment-event.json
          import json
          import os

          result = os.environ["DEPLOY_RESULT"]

          event = {
              "timestamp": os.environ["DEPLOY_TIMESTAMP"],
              "tool": "puppet",
              "branch": os.environ["DEPLOY_BRANCH"],
              "commit": os.environ["DEPLOY_COMMIT"],
              "status": "success" if result == "success" else "failure"
          }

          with open("deployment-event.json", "w") as f:
              json.dump(event, f)
          PY

          EVENT_B64=$(base64 -w 0 deployment-event.json)

          REMOTE_COMMAND="echo '$EVENT_B64' | base64 -d | sudo tee -a /var/log/synora-deployments.log >/dev/null"

          PARAMETERS=$(python3 -c \
            'import json,sys; print(json.dumps({"commands":[sys.argv[1]]}))' \
            "$REMOTE_COMMAND")

          if COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Log Puppet deployment result ${DEPLOY_COMMIT}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text); then
            echo "Deployment event submitted to EC2. SSM command: $COMMAND_ID"
          else
            echo "::warning::Could not submit the deployment event to EC2."
          fi
