
name: Synora Ansible Deployment

on:
  push:
    branches:
      - ansible-scm
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synora-ansible-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Synora with Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      # 1. Download repository code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Ansible
      - name: Install Ansible
        run: |
          set -euo pipefail
          python3 -m pip install --user ansible
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 3. Validate required secrets
      - name: Validate SSH secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is missing."
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "ERROR: EC2_USER secret is missing."
            exit 1
          fi

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is missing."
            exit 1
          fi

          echo "Required SSH secrets are present."

      # 4. Configure SSH authentication
      - name: Configure SSH
        id: configure_ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/synora_ec2"
          chmod 600 "$HOME/.ssh/synora_ec2"

          ssh-keygen -y -f "$HOME/.ssh/synora_ec2" > /dev/null

          echo "SSH private key format is valid."

      # 5. Check EC2 SSH port reachability
      - name: Check EC2 SSH connectivity
        id: check_ssh
        run: |
          set -euo pipefail

          echo "Checking SSH port 22 on EC2..."

          if ! timeout 10 bash -c \
            'echo > /dev/tcp/$1/22' _ "$EC2_HOST"; then
            echo "ERROR: EC2 port 22 is unreachable."
            echo "Check the EC2 security group and network access."
            exit 1
          fi

          echo "EC2 SSH port is reachable."

      # 6. Configure known hosts
      # For production, use a trusted, pinned host key.
      - name: Configure known hosts
        run: |
          set -euo pipefail

          ssh-keyscan -T 10 -H "$EC2_HOST" \
            >> "$HOME/.ssh/known_hosts"

          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # 7. Create CI inventory
      - name: Configure Ansible inventory
        run: |
          set -euo pipefail

          cat > ansible/ci-inventory.ini <<EOF
          [synora_servers]
          synora_ec2 ansible_host=${EC2_HOST} ansible_user=${EC2_USER} ansible_python_interpreter=/usr/bin/python3 ansible_ssh_private_key_file=$HOME/.ssh/synora_ec2
          EOF

      # 8. Verify SSH and Ansible connectivity
      - name: Test Ansible connection
        run: |
          set -euo pipefail

          ansible synora_servers \
            -i ansible/ci-inventory.ini \
            -m ansible.builtin.ping

      # 9. Run the Ansible playbook
      - name: Deploy Synora services
        id: ansible_deploy
        run: |
          set -euo pipefail

          ansible-playbook \
            -i ansible/ci-inventory.ini \
            ansible/playbook.yml

      # 10. Report deployment result
      - name: Deployment completed
        if: steps.ansible_deploy.outcome == 'success'
        run: |
          echo "Ansible deployment completed successfully."

      # 11. Log deployment result to EC2 for CloudWatch collection
      - name: Log deployment result to CloudWatch
        if: always() && steps.configure_ssh.outcome == 'success' && steps.check_ssh.outcome == 'success'
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RESULT: ${{ steps.ansible_deploy.outcome }}
        run: |
          set -euo pipefail

          export DEPLOY_TIMESTAMP
          DEPLOY_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 - <<'PY' > deployment-event.json
          import json
          import os

          event = {
              "timestamp": os.environ["DEPLOY_TIMESTAMP"],
              "tool": "ansible",
              "branch": os.environ["DEPLOY_BRANCH"],
              "commit": os.environ["DEPLOY_COMMIT"],
              "status": (
                  "success"
                  if os.environ["DEPLOY_RESULT"] == "success"
                  else "failure"
              )
          }

          with open("deployment-event.json", "w") as f:
              json.dump(event, f)
          PY

          EVENT_B64=$(base64 -w 0 deployment-event.json)

          REMOTE_COMMAND="echo '$EVENT_B64' | base64 -d | sudo tee -a /var/log/synora-deployments.log >/dev/null"

          if ssh \
            -i "$HOME/.ssh/synora_ec2" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "$REMOTE_COMMAND"; then
            echo "Ansible deployment event written to EC2 log file."
          else
            echo "::warning::Could not write the Ansible deployment event to EC2."
          fi
