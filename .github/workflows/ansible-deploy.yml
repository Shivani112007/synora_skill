
name: Synora Ansible Deployment

on:
  push:
    branches:
      - ansible-scm
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synora-ansible-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Synora with Ansible
    runs-on: self-hosted
    timeout-minutes: 15

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      # 1. Checkout repository code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Verify required secrets
      - name: Validate SSH secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is missing."
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "ERROR: EC2_USER secret is missing."
            exit 1
          fi

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is missing."
            exit 1
          fi

          echo "Required SSH secrets are present."

      # 3. Install Ansible if it is not already available
      - name: Install Ansible
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ansible-playbook >/dev/null 2>&1; then
            if command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y python3 python3-pip
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y python3 python3-pip
            else
              echo "ERROR: Install Python and pip for this runner OS."
              exit 1
            fi

            python3 -m pip install --user ansible
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi

          ansible --version

      # 4. Configure SSH authentication
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/synora_ec2"
          chmod 600 "$HOME/.ssh/synora_ec2"

          ssh-keygen -y -f "$HOME/.ssh/synora_ec2" \
            > /dev/null

          echo "SSH private key format is valid."

      # 5. Configure Ansible inventory
      - name: Configure Ansible inventory
        shell: bash
        run: |
          set -euo pipefail

          cat > ansible/ci-inventory.ini <<EOF
          [synora_servers]
          synora_ec2 ansible_host=${EC2_HOST} ansible_user=${EC2_USER} ansible_python_interpreter=/usr/bin/python3 ansible_ssh_private_key_file=$HOME/.ssh/synora_ec2
          EOF

      # 6. Test the Ansible connection
      - name: Test Ansible connection
        shell: bash
        run: |
          set -euo pipefail

          ansible synora_servers \
            -i ansible/ci-inventory.ini \
            -m ansible.builtin.ping

      # 7. Run the Ansible playbook
      - name: Deploy Synora services
        shell: bash
        run: |
          set -euo pipefail

          ansible-playbook \
            -i ansible/ci-inventory.ini \
            ansible/playbook.yml

      # 8. Report deployment result
      - name: Deployment completed
        run: echo "Ansible deployment completed successfully."
