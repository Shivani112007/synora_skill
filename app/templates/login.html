<div class="login-wrap">
    <div class="login-card"><span class="eyebrow">Welcome back</span>
        <h1 style="margin-top:15px">Sign in to SYNORA</h1>
        <p>Continue building your portfolio and discovering opportunities.</p>
        <form method=post>
            <div class="field"><label for="login-email">Email</label><input id="login-email" name=email type=email
                    autocomplete=email required placeholder="you@example.com"></div>
            <div class="field"><label for="login-password">Password</label><input id="login-password" name=password
                    type=password autocomplete=current-password required placeholder="••••••••"></div>
            <div class="form-actions"><button class="btn btn-primary" style="width:100%">Sign in →</button></div>
        </form>
        <p style="text-align:center;font-size:13px">New here? <a style="color:var(--brand);font-weight:800"
                href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</div>
