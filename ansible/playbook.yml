---
- name: Manage Synora application services with Ansible
  hosts: synora_servers
  become: true
  gather_facts: false

  tasks:
    - name: Ensure Synora service is running and enabled
      ansible.builtin.systemd_service:
        name: synora
        state: started
        enabled: true

    - name: Ensure Nginx service is running and enabled
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true
